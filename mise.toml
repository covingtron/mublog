[tools]
gh = 'latest'
opentofu = '1.11.3'

[tasks.build]
run = 'mkdocs build "$@"'

[tasks.deploy]
run = '''
#!/usr/bin/env bash
set -o errexit -o nounset -o pipefail
envi=${1:?missing envi}
mkdir -p site/ton/flan
printf 'CONA=mublog\nENVI=%s\nGIHA=%s\nTABR=%s\n' "$envi" "$(mise giha)" "$(mise tabr)" \
    > site/ton/flan/index.html
mise tapply "$@"
'''

[tasks.preview]
run = 'mkdocs serve "$@"'
