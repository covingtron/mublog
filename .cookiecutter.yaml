default_context:
    domain_name: cov.ing/ton/
    languages: Node,Python,Terraform
    node_dev_dependencies:
        wrangler: '*'
    python_dependencies:
        - helicopyter>=2026.38.1
        - mkdocs-material
        - mkdocs-macros-plugin
    python_optional_dependencies:
        dev:
            - playwright
            - setuptools
    github_actions_env:
        AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
        AWS_ENDPOINT_URL_S3: ${{ vars.AWS_ENDPOINT_URL_S3 }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        CLOUDFLARE_EMAIL: ${{ vars.CLOUDFLARE_EMAIL }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        INSH_TF: tofu
        TENV_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        PATH: .venv/bin:/home/runner/.local/bin:/home/runner/.local/share/mise/shims:/usr/bin:/bin
